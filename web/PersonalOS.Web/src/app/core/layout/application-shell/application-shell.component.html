<a class="skip-link" href="#main-content">Skip to main content</a>

<div class="shell">
  <aside
    id="primary-navigation"
    class="sidebar"
    [class.sidebar--open]="isNavigationOpen()"
    aria-label="Primary navigation"
  >
    <div class="sidebar__brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 48 48">
          <path d="M24 5 39 13.5v17L24 39 9 30.5v-17L24 5Z" />
          <path d="M18 23.5 22.2 27.7 31 18.9" />
        </svg>
      </span>
      <span>PersonalOS</span>
    </div>

    <nav class="sidebar__nav" aria-label="Application">
      <a
        routerLink="/app/today"
        routerLinkActive="nav-link--active"
        ariaCurrentWhenActive="page"
        class="nav-link"
        (click)="closeNavigation()"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M7 3v3M17 3v3M4 9h16M5 5h14v15H5z" />
        </svg>
        <span>Today</span>
      </a>
      <a
        routerLink="/app/calendar"
        routerLinkActive="nav-link--active"
        ariaCurrentWhenActive="page"
        class="nav-link"
        (click)="closeNavigation()"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 5h16v15H4zM4 10h16M8 3v4M16 3v4M8 14h3M8 17h3M14 14h2" />
        </svg>
        <span>Calendar</span>
      </a>
      <a
        routerLink="/app/routines"
        routerLinkActive="nav-link--active"
        ariaCurrentWhenActive="page"
        class="nav-link"
        (click)="closeNavigation()"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 6h4M4 12h4M4 18h4M11 6h9M11 12h9M11 18h9" />
        </svg>
        <span>Routines</span>
      </a>
      <a
        routerLink="/app/nutrition"
        routerLinkActive="nav-link--active"
        ariaCurrentWhenActive="page"
        class="nav-link"
        (click)="closeNavigation()"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M6 3v8a3 3 0 0 0 6 0V3M9 11v10M17 3c-1.5 2-2 4-2 6h4c0-2-.5-4-2-6ZM17 9v12" />
        </svg>
        <span>Nutrition</span>
      </a>
      <a
        routerLink="/app/study"
        routerLinkActive="nav-link--active"
        ariaCurrentWhenActive="page"
        class="nav-link"
        (click)="closeNavigation()"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 5h7a2 2 0 0 1 2 2v13a2 2 0 0 0-2-2H4zM20 5h-7a2 2 0 0 0-2 2v13a2 2 0 0 1 2-2h7z" />
        </svg>
        <span>Study</span>
      </a>
      <a
        routerLink="/app/journal"
        routerLinkActive="nav-link--active"
        ariaCurrentWhenActive="page"
        class="nav-link"
        (click)="closeNavigation()"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M6 3h11a2 2 0 0 1 2 2v16H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2ZM9 8h7M9 12h7M9 16h4" />
        </svg>
        <span>Journal</span>
      </a>
      <a
        routerLink="/app/settings"
        routerLinkActive="nav-link--active"
        ariaCurrentWhenActive="page"
        class="nav-link"
        (click)="closeNavigation()"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z" />
          <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2 3-.2-.1a1.7 1.7 0 0 0-1.9-.2 1.7 1.7 0 0 0-1 1.5V21h-5v-.3a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.9.2l-.2.1-2-3 .1-.1A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.4-1H3v-4h.2a1.7 1.7 0 0 0 1.4-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1 2-3 .2.1a1.7 1.7 0 0 0 1.9.2 1.7 1.7 0 0 0 1-1.5V3h5v.3a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.2l.2-.1 2 3-.1.1A1.7 1.7 0 0 0 19.4 9a1.7 1.7 0 0 0 1.4 1h.2v4h-.2a1.7 1.7 0 0 0-1.4 1Z" />
        </svg>
        <span>Settings</span>
      </a>
    </nav>
  </aside>

  @if (isNavigationOpen()) {
    <button
      class="shell__scrim"
      type="button"
      aria-label="Close navigation"
      (click)="closeNavigation()"
    ></button>
  }

  <div class="workspace">
    <header class="topbar">
      <button
        class="icon-button topbar__menu"
        type="button"
        aria-controls="primary-navigation"
        [attr.aria-expanded]="isNavigationOpen()"
        [attr.aria-label]="isNavigationOpen() ? 'Close navigation' : 'Open navigation'"
        [title]="isNavigationOpen() ? 'Close navigation' : 'Open navigation'"
        (click)="toggleNavigation()"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 7h16M4 12h16M4 17h16" />
        </svg>
      </button>

      <div class="topbar__identity" aria-label="Current account">
        <span class="avatar" aria-hidden="true">{{ displayInitials() }}</span>
        <span>
          <strong>{{ currentUser()?.displayName }}</strong>
          <small>{{ currentUser()?.email }}</small>
        </span>
      </div>

      <button
        class="button button--secondary topbar__logout"
        type="button"
        [disabled]="isLoggingOut()"
        [attr.aria-busy]="isLoggingOut()"
        (click)="logout()"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M10 17l5-5-5-5M15 12H3M21 4v16h-6" />
        </svg>
        <span>{{ isLoggingOut() ? 'Signing out' : 'Sign out' }}</span>
      </button>
    </header>

    <main id="main-content" class="workspace__main" tabindex="-1">
      <router-outlet />
    </main>
  </div>
</div>
