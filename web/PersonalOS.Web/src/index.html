<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>PersonalOS</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script>
    (function () {
      var storageKey = 'personalos.themePreference';
      var preference = 'system';
      var storedPreference;

      try {
        storedPreference = window.localStorage.getItem(storageKey);
      } catch (_) {
        storedPreference = null;
      }

      if (
        storedPreference === 'light'
        || storedPreference === 'dark'
        || storedPreference === 'system'
      ) {
        preference = storedPreference;
      }

      var prefersDark = false;

      if (window.matchMedia) {
        prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      }

      var resolvedTheme = preference === 'system'
        ? prefersDark ? 'dark' : 'light'
        : preference;

      document.documentElement.setAttribute('data-theme-preference', preference);
      document.documentElement.setAttribute('data-theme', resolvedTheme);
      document.documentElement.style.colorScheme = resolvedTheme;

      var colorScheme = document.querySelector('meta[name="color-scheme"]');

      if (colorScheme) {
        colorScheme.setAttribute('content', preference === 'system' ? 'light dark' : resolvedTheme);
      }
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
